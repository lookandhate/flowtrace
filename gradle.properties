pluginGroup=io.github.lookandhate.flowtrace
pluginName=Flow Trace for Go
pluginVersion=0.3.0
pluginSinceBuild=263

# Версия GoLand для сборки, если не задан goLandPath: тогда Gradle скачает её сам.
# Чтобы собирать против установленной GoLand, задайте в ~/.gradle/gradle.properties:
#   goLandPath=/путь/к/GoLand.app
platformVersion=2026.3

org.gradle.jvmargs=-Xmx2g

# Kotlin stdlib уже есть в IDE — не кладём свою копию в плагин.
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
